databases:
  - name: nexus-search-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: nexus-search-api
    runtime: python
    plan: free
    buildCommand: >
      pip install torch --index-url https://download.pytorch.org/whl/cpu &&
      pip install -e .
    startCommand: >
      python -m nexus.db.migrate &&
      python seed_demo.py &&
      uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-search-db
          property: connectionString
      - key: NEXUS_DISABLE_SCHEDULER
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.9"
