name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ankane/pgvector
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexusdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexusdb_test
        run: python -m nexus.db.migrate

      - name: Run tests
        env:
          DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexusdb_test
          GITHUB_TOKEN: placeholder_for_ci
          NOTION_TOKEN: placeholder_for_ci
        run: pytest tests/ -v --tb=short
